name: Verified release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:local
      - run: npx wrangler deploy --dry-run
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go test -race ./... && go vet ./...
        working-directory: agent
      - name: Real pinned Xray Reality integration
        run: |
          mkdir -p "$RUNNER_TEMP/xray"
          curl -fsSL --proto '=https' --proto-redir '=https' https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip -o "$RUNNER_TEMP/xray/xray.zip"
          echo "23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  $RUNNER_TEMP/xray/xray.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/xray/xray.zip" xray > "$RUNNER_TEMP/xray/xray"
          chmod 700 "$RUNNER_TEMP/xray/xray"
          cd agent
          XRAY_BIN="$RUNNER_TEMP/xray/xray" go test ./internal/daemon -run TestRealXrayRuntime -count=1
      - run: sudo apt-get update && sudo apt-get install -y shellcheck unzip
      - run: shellcheck scripts/*.sh && bash -n scripts/*.sh
      - run: python3 scripts/test-install.py
  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Fixed version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=v0.1.1
          if [[ "$REF_TYPE" == tag ]]; then version="$REF_NAME"; fi
          [[ "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          printf 'RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Reproducible cross compilation
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/stage/bin dist/stage/packaging
          (cd agent && go build -trimpath -ldflags="-s -w -buildid= -X main.version=$RELEASE_VERSION" -o ../dist/stage/bin/proxysetting-agent ./cmd/proxysetting-agent)
          cp packaging/proxysetting-*.service dist/stage/packaging/
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner -C dist/stage -czf "dist/proxysetting-agent-linux-$GOARCH.tar.gz" bin/proxysetting-agent packaging/proxysetting-agent.service packaging/proxysetting-xray.service
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: dist
          merge-multiple: true
      - name: Fixed release manifest
        run: |
          install -m 0755 scripts/install.sh dist/install.sh
          (cd dist && sha256sum install.sh proxysetting-agent-linux-amd64.tar.gz proxysetting-agent-linux-arm64.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: dist/*
      - name: Upload GitHub Release assets (tag only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          # Never clobber an existing immutable release/version.
          if gh release view "$TAG" >/dev/null 2>&1; then
            printf 'Release exists; refusing to overwrite assets.\n' >&2
            exit 1
          fi
          gh release create "$TAG" dist/install.sh dist/SHA256SUMS dist/*.tar.gz --verify-tag --title "$TAG" --generate-notes
