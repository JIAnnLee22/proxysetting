name: Verified release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  XRAY_VERSION: 'v26.3.27'
  XRAY_AMD64_SHA: '23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae'
  XRAY_ARM64_SHA: '4d30283ae614e3057f730f67cd088a42be6fdf91f8639d82cb69e48cde80413c'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:local
      - run: npx wrangler deploy --dry-run
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go test -race ./... && go vet ./...
        working-directory: agent
      - name: Real pinned Xray Reality integration
        run: |
          mkdir -p "$RUNNER_TEMP/xray"
          curl -fsSL --proto '=https' --proto-redir '=https' "https://github.com/XTLS/Xray-core/releases/download/$XRAY_VERSION/Xray-linux-64.zip" -o "$RUNNER_TEMP/xray/xray.zip"
          printf '%s  %s\n' "$XRAY_AMD64_SHA" "$RUNNER_TEMP/xray/xray.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/xray/xray.zip" xray > "$RUNNER_TEMP/xray/xray"
          chmod 700 "$RUNNER_TEMP/xray/xray"
          cd agent
          XRAY_BIN="$RUNNER_TEMP/xray/xray" go test ./internal/daemon -run TestRealXrayRuntime -count=1
      - run: sudo apt-get update && sudo apt-get install -y shellcheck unzip
      - run: shellcheck scripts/*.sh && bash -n scripts/*.sh
      - run: python3 scripts/test-install.py
  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Fixed version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=v0.1.1
          if [[ "$REF_TYPE" == tag ]]; then version="$REF_NAME"; fi
          [[ "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          printf 'RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Reproducible cross compilation
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/stage/bin dist/stage/packaging
          (cd agent && go build -trimpath -ldflags="-s -w -buildid= -X main.version=$RELEASE_VERSION" -o ../dist/stage/bin/proxysetting-agent ./cmd/proxysetting-agent)
          cp packaging/proxysetting-*.service dist/stage/packaging/
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner -C dist/stage -czf "dist/proxysetting-agent-linux-$GOARCH.tar.gz" bin/proxysetting-agent packaging/proxysetting-agent.service packaging/proxysetting-xray.service
      - name: Repackage pinned Xray for tar-only installation
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH" in
            amd64) asset='Xray-linux-64.zip'; digest=$XRAY_AMD64_SHA ;;
            arm64) asset='Xray-linux-arm64-v8a.zip'; digest=$XRAY_ARM64_SHA ;;
            *) exit 1 ;;
          esac
          archive="$RUNNER_TEMP/xray-$ARCH.zip"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 20 --max-time 300 --retry 2 "https://github.com/XTLS/Xray-core/releases/download/$XRAY_VERSION/$asset" --output "$archive"
          printf '%s  %s\n' "$digest" "$archive" | sha256sum -c -
          mkdir -p dist/xray-stage/bin
          unzip -p "$archive" xray > dist/xray-stage/bin/xray
          test -s dist/xray-stage/bin/xray
          chmod 0755 dist/xray-stage/bin/xray
          sed "s/@XRAY_VERSION@/$XRAY_VERSION/g" packaging/xray-NOTICE.txt > dist/xray-stage/NOTICE.txt
          chmod 0644 dist/xray-stage/NOTICE.txt
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner -C dist/xray-stage -czf "dist/proxysetting-xray-linux-$ARCH.tar.gz" NOTICE.txt bin/xray
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: dist
          merge-multiple: true
      - name: Fixed release manifest
        run: |
          install -m 0755 scripts/install.sh dist/install.sh
          install -m 0755 scripts/uninstall.sh dist/uninstall.sh
          (cd dist && sha256sum install.sh uninstall.sh proxysetting-agent-linux-amd64.tar.gz proxysetting-agent-linux-arm64.tar.gz proxysetting-xray-linux-amd64.tar.gz proxysetting-xray-linux-arm64.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: dist/*
      - name: Upload GitHub Release assets (tag only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          # Never clobber an existing immutable release/version.
          if gh release view "$TAG" >/dev/null 2>&1; then
            printf 'Release exists; refusing to overwrite assets.\n' >&2
            exit 1
          fi
          gh release create "$TAG" dist/install.sh dist/uninstall.sh dist/SHA256SUMS dist/*.tar.gz --verify-tag --title "$TAG" --generate-notes
